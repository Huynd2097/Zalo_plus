<!-- TOAST NOTIFICATION HỆ THỐNG -->
<div id="toast"
  class="fixed bottom-4 right-4 bg-slate-900 text-white px-3.5 py-2 rounded-xl shadow-xl flex items-center gap-2 transform translate-y-24 opacity-0 pointer-events-none transition-all duration-200 z-50">
  <span class="p-1 rounded-full bg-emerald-500 text-white flex items-center justify-center flex-shrink-0"
    id="toastIcon">
    <i data-lucide="check" class="w-3.5 h-3.5 stroke-[4]"></i>
  </span>
  <span class="text-xs font-semibold" id="toastMessage">Thông báo!</span>
</div>
