<div class="max-w-[1536px] mx-auto px-4 sm:px-6 lg:px-8 space-y-4 w-full">
<div class="app-sticky-panel sticky top-0 z-40 bg-slate-50 pt-1 pb-1 border-b border-slate-200/70 shadow-sm">
<!-- HEADER TAB DANH BẠ -->
<div
  class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white px-3 py-1.5 rounded-lg border border-slate-200/60 shadow-xs gap-2">
  <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
    <h2 class="text-sm font-bold text-slate-900">Quản lý cơ sở dữ liệu Danh bạ</h2>
    <p id="contactSummaryLabel" class="text-xs text-slate-400">0 liên hệ đã lưu trong hệ thống.</p>
  </div>
  <div class="flex flex-wrap items-center justify-end gap-2 w-full sm:w-auto">
    <!-- Trình chuẩn hóa danh bạ AI -->
    <button id="btnOpenAiNormalizer"
      class="flex-1 sm:flex-initial bg-gradient-to-r from-indigo-600 to-violet-600 hover:opacity-95 text-white font-semibold py-1.5 px-4 rounded-lg text-xs flex items-center justify-center gap-1.5 transition-all active:scale-95 shadow-xs">
      <span>✨</span> AI Chuẩn hóa Danh bạ
    </button>

    <button id="syncContactsBtn"
      class="flex-1 sm:flex-initial bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-1.5 px-4 rounded-lg text-xs flex items-center justify-center gap-1.5 transition-all active:scale-95 shadow-xs">
      <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
      Đồng bộ
    </button>

    <!-- Dropdown Tùy chọn khác -->
    <div class="relative inline-block text-left" id="dropdownContainer">
      <button id="btnContactActionsToggle"
        class="flex-1 sm:flex-initial bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-semibold py-1.5 px-4 rounded-lg text-xs flex items-center justify-center gap-1.5 transition-all active:scale-95 shadow-xs">
        Tùy chọn khác
        <i data-lucide="chevron-down" class="w-3 h-3"></i>
      </button>
      <div id="contactActionsDropdown"
        class="origin-top-right absolute right-0 mt-1 w-40 rounded-lg shadow-md bg-white ring-1 ring-black ring-opacity-5 z-20 hidden">
        <div class="py-1">
          <button id="btnReloadContacts"
            class="w-full text-left px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-50 flex items-center gap-1.5">
            <i data-lucide="rotate-cw" class="w-3.5 h-3.5 text-slate-400"></i> Tải lại bảng
          </button>
          <button id="btnExportContacts"
            class="w-full text-left px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-50 flex items-center gap-1.5">
            <i data-lucide="download" class="w-3.5 h-3.5 text-slate-400"></i> Xuất Excel (XLSX)
          </button>
          <hr class="border-slate-100 my-1">
          <button id="btnClearContacts"
            class="w-full text-left px-3 py-1.5 text-xs text-rose-600 hover:bg-rose-50 flex items-center gap-1.5">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Xóa danh bạ
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
</div>

<!-- BẢNG ĐIỀU KHIỂN GẮN TAG HÀNG LOẠT -->
<div class="flex flex-col gap-2.5">
  <button 
    type="button" 
    id="btnToggleTagBulk"
    class="w-full bg-slate-50 hover:bg-slate-100/80 border border-slate-200/80 rounded-xl py-2.5 px-4 flex items-center justify-between text-xs font-bold text-slate-700 shadow-2xs transition-all active:scale-98"
  >
    <span class="flex items-center gap-2">
      <i data-lucide="tags" class="text-indigo-600 w-4 h-4"></i>
      <span>GẮN TAG ĐỒNG LOẠT THEO SỐ ĐIỆN THOẠI</span>
    </span>
    <div class="flex items-center gap-1.5 bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full text-[10px] font-extrabold shadow-3xs">
      <span id="tagBulkCollapseStatusText">ĐANG MỞ</span>
      <i data-lucide="chevron-up" class="w-3.5 h-3.5 transition-transform duration-200" id="tagBulkCollapseIcon"></i>
    </div>
  </button>

  <div class="bg-white rounded-xl border border-slate-200/60 shadow-xs overflow-hidden transition-all duration-200 animate-fade-in" id="tagBulkCard">
    <div class="p-4 transition-all duration-200" id="tagBulkContent">
      <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,0.75fr)_minmax(0,1fr)] gap-4 items-start">
        <div class="space-y-3">
          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Tên nhãn cần gắn (Tag name)</label>
            <input id="tagNameInput" type="text" placeholder="Ví dụ: Khách VIP, Tiềm năng..."
              class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500 text-xs font-semibold transition-all">
          </div>

          <div class="space-y-1">
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Màu tag đại diện</label>
            <div class="flex items-center gap-3">
              <input id="tagColorInput" type="color" value="#4f46e5"
                class="w-8 h-8 p-0.5 border border-slate-200 rounded bg-white cursor-pointer">
              <span class="text-[10px] text-slate-500 font-mono min-w-[68px]" id="hexVal">#4F46E5</span>
              <button id="updateTagColorBtn"
                class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-1.5 px-3 rounded-lg text-xs flex items-center gap-1 transition-all active:scale-95 shadow-xs">
                Đổi màu
              </button>
              <button id="applyTagBtn"
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 px-3 rounded-lg text-xs flex items-center gap-1 transition-all active:scale-95 shadow-xs">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                Gắn nhãn
              </button>
            </div>
          </div>
        </div>

        <div class="space-y-1">
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Danh sách SĐT cần gắn (Mỗi số một dòng)</label>
          <textarea id="tagPhonesInput" placeholder="0987654321&#10;0123456789"
            class="w-full p-2.5 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500 font-mono text-xs shadow-inner h-24 resize-none transition-colors"></textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- BẢNG DANH BẠ KHÁCH HÀNG -->
<div class="bg-white rounded-xl shadow-xs border border-slate-200/60 overflow-hidden">

  <!-- Header bảng: Tìm kiếm và thêm liên hệ nhanh -->
  <div
    class="p-3 bg-slate-50 border-b border-slate-200/60 flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
    <div class="flex flex-wrap items-center gap-1.5">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 pointer-events-none text-slate-400">
          <i data-lucide="search" class="w-3 h-3"></i>
        </span>
        <input type="text" id="contactSearchInput" placeholder="Tìm kiếm danh bạ..."
          class="pl-7 pr-2 py-1 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500 text-xs w-[140px] transition-all">
      </div>

      <div class="relative">
        <button id="contactTagFilterBtn"
          class="bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-bold py-1 px-2.5 rounded-lg text-xs flex items-center gap-1 transition-all">
          <span id="contactTagFilterLabel">Tất cả tag</span>
          <i data-lucide="chevron-down" class="w-3 h-3"></i>
        </button>
        <div id="contactTagFilterDropdown"
          class="origin-top-left absolute left-0 mt-1 w-36 rounded-lg shadow-md bg-white ring-1 ring-black ring-opacity-5 z-20 hidden">
          <div class="py-1" id="contactTagFilterOptions">
            <button data-contact-tag-filter=""
              class="w-full text-left px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-50">
              Tất cả tag
            </button>
          </div>
        </div>
      </div>
    </div>

    <button id="btnOpenAddContact"
      class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-1.5 px-3 rounded-lg text-xs flex items-center justify-center gap-1.5 transition-all active:scale-95">
      <i data-lucide="user-plus" class="w-3.5 h-3.5"></i>
      Tạo liên hệ mới
    </button>
  </div>

  <div class="overflow-x-auto w-full">
    <table class="w-full text-left border-collapse min-w-[1040px]">
      <thead>
        <tr
          class="bg-slate-50 border-b border-slate-200 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
          <th class="px-2 py-2.5 w-[40px] text-center">STT</th>
          <th class="px-4 py-2.5 w-[260px]">
            <button type="button" data-contact-sort="display_name" class="flex items-center gap-1 hover:text-slate-700 transition-colors">
              Tên hiển thị
              <i data-lucide="arrow-up-down" class="w-3 h-3"></i>
            </button>
          </th>
          <th class="px-3 py-2.5 w-[130px]">
            <button type="button" data-contact-sort="tag" class="flex items-center gap-1 hover:text-slate-700 transition-colors">
              Nhãn
              <i data-lucide="arrow-up-down" class="w-3 h-3"></i>
            </button>
          </th>
          <th class="px-3 py-2.5 w-[120px]">Số điện thoại</th>
          <th class="px-3 py-2.5 w-[90px]">Xưng hô</th>
          <th class="px-3 py-2.5 w-[110px]">
            <button type="button" data-contact-sort="_name" class="flex items-center gap-1 hover:text-slate-700 transition-colors">
              Tên gọi
              <i data-lucide="arrow-up-down" class="w-3 h-3"></i>
            </button>
          </th>
          <th class="px-3 py-2.5 w-[150px]">Zalo ID</th>
          <th class="px-3 py-2.5 w-[120px]">
            <button type="button" data-contact-sort="updatedAt" class="flex items-center gap-1 hover:text-slate-700 transition-colors">
              Cập nhật
              <i data-lucide="arrow-up-down" class="w-3 h-3"></i>
            </button>
          </th>
          <th class="px-3 py-2.5 w-[80px] text-center">Xóa</th>
        </tr>
      </thead>
      <tbody id="contactsDatabaseBody" class="divide-y divide-slate-100 text-xs text-slate-600">
        <!-- Render danh sách danh bạ gốc động -->
      </tbody>
    </table>
  </div>
</div>
</div>
